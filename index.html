    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How can an AI model run directly in a browser?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Modern browsers support WebGPU, a new API that gives web apps direct access to your GPU. Combined with 4-bit quantization that shrinks models by ~8x, and WebAssembly for near-native performance, it's now possible to run models with billions of parameters right in a browser tab."
          }
        },
        {
          "@type": "Question",
          "name": "What hardware do I need to run LLMs in my browser?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A device with a modern GPU that supports WebGPU. Most recent laptops and desktops with Chrome 113+, Edge 113+, or Safari 18.2+ will work. Smaller models (1-3B parameters) run on most machines, while larger models (7B+) need a dedicated GPU with 6+ GB VRAM."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data really private when using BrowserLLM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. All inference happens locally on your device. No data is sent to any server — there is no server. Your conversations are stored only in your browser's local storage. You can verify this by going offline after the first model download — everything still works."
          }
        },
        {
          "@type": "Question",
          "name": "How does BrowserLLM compare to ChatGPT or Claude?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cloud-based models like GPT-4 or Claude are more powerful for complex reasoning tasks. BrowserLLM trades some capability for complete privacy, zero cost, offline access, and no accounts needed. For many everyday tasks — writing, coding help, brainstorming — local models are more than capable."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to download the model every time?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Models are cached in your browser's Cache API after the first download. Subsequent visits load the model from local cache in seconds. You can also install BrowserLLM as a PWA for a native app-like experience."
          }
        },
        {
          "@type": "Question",
          "name": "Which AI models are available on BrowserLLM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Over 100 models from families like Llama, Qwen, Phi, Gemma, Mistral, DeepSeek, SmolLM, and more. Models range from tiny 135M parameter models to 70B parameter powerhouses. You can filter by category (general, coding, math, reasoning), size, and hardware compatibility."
          }
        },
        {
          "@type": "Question",
          "name": "Is BrowserLLM really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, forever. There are no API keys, no subscriptions, no per-token charges. The computation happens on your own GPU. The app is open-source and can be self-hosted."
          }
        }
      ]
    }
    </script>
