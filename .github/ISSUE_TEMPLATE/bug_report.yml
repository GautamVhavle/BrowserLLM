name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to the Models page
        2. Click on a model card
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Edge
        - Safari (WebGPU must be enabled in flags)
        - Firefox (WebGPU experimental)
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS 15, Windows 11, Ubuntu 24
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU (if known)
      placeholder: e.g. Apple M3, NVIDIA RTX 4070, Intel Iris Xe

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste any errors from the browser console (F12 > Console)
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, hardware detection panel output, or anything else that helps.
